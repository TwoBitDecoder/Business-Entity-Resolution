seed: 42

data:
  train_dir: data/train
  test_dir: data/test

normalization:
  unicode_form: NFKC
  lowercase: true
  strip_punctuation: true
  collapse_whitespace: true

candidates:
  char_tfidf:
    enabled: true
    ngram_range: [3, 5]
    top_k_name: 20
    top_k_address: 20
    top_k_combined: 40
  exact_rules:
    enabled: false
  dense:
    enabled: false

model:
  type: lightgbm
  decision_threshold: 0.09

evaluation:
  beta: 0.5
  candidate_recall_ks: [5, 10, 20, 40]
